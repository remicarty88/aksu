<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoCase · Админка</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3e0;--ink:#17120d;--mute:#6b5f52;--w:#fffdf8;--sun:#ffc53d;--mint:#3fd1a0;--blue:#3d5bff;--red:#ff5a36;--bd:2px solid var(--ink);--sh:4px 4px 0 var(--ink)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;margin:0;letter-spacing:.3px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:var(--bd);background:var(--w);border-radius:14px;padding:9px 16px;font-weight:700;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.p{background:var(--blue);color:#fff}
.btn.d{background:var(--red);color:#fff}
.btn.s{background:var(--sun)}
.btn.sm{padding:5px 11px;font-size:.82rem;box-shadow:2px 2px 0 var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:var(--bd);background:var(--w)}
.logo{font-family:Anton,sans-serif;font-size:1.4rem;text-transform:uppercase;background:var(--sun);border:var(--bd);border-radius:12px;padding:2px 12px;box-shadow:var(--sh)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:var(--bd);background:var(--w);border-radius:99px;padding:8px 18px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);color:var(--sun)}
main{padding:24px;max-width:1200px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.bar h1{font-size:2.4rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.stack{grid-template-columns:1fr}
.item{background:var(--w);border:var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.item h3{margin:0;font-size:1.05rem;font-weight:700;line-height:1.3}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border:var(--bd);border-radius:14px;background:#eee}
.muted{color:var(--mute);font-size:.84rem}
.pill{align-self:flex-start;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:.74rem;font-weight:700;background:var(--mint)}
.pill.off{background:#e6e1d8}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--ink);border-radius:99px;padding:1px 9px;font-size:.76rem;font-weight:600;background:var(--sun)}
.price{font-family:Anton,sans-serif;font-size:1.4rem}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
dialog{border:var(--bd);border-radius:24px;padding:0;width:min(600px,94vw);box-shadow:8px 8px 0 var(--ink);background:var(--w);color:var(--ink)}
dialog::backdrop{background:rgba(23,18,13,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:var(--bd)}
.dh h2{font-size:1.6rem}
form.f{padding:18px 20px;display:grid;gap:12px;max-height:68vh;overflow:auto}
label{display:grid;gap:5px;font-weight:700;font-size:.84rem}
label.inline{display:flex;align-items:center;gap:8px}
input,select,textarea{border:var(--bd);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
.fits{display:flex;flex-wrap:wrap;gap:6px}
.fits label{display:flex;align-items:center;gap:6px;border:var(--bd);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.84rem;background:#fff}
.gal{display:flex;flex-wrap:wrap;gap:10px}
.gal .g{position:relative;width:110px;height:110px;border:var(--bd);border-radius:14px;overflow:hidden;background:#fff}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:var(--bd);background:var(--w);cursor:pointer;font-weight:800;line-height:1}
.gal .up{width:110px;height:110px;border:2px dashed var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.8rem;cursor:pointer;background:#fff;padding:6px}
.gal .up input{display:none}
.dfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:var(--bd)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:var(--w);border:var(--bd);border-radius:26px;box-shadow:var(--sh);padding:28px;width:min(380px,100%);display:grid;gap:14px}
.err{color:var(--red);font-weight:700;font-size:.85rem;min-height:1em}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
.empty{text-align:center;padding:60px;color:var(--mute);font-weight:700;grid-column:1/-1}
@media(max-width:600px){main{padding:16px}.bar h1{font-size:1.9rem}}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="lbox" id="lf">
    <div class="logo" style="justify-self:start">GoCase</div>
    <h2>Вход в админку</h2>
    <label>Email<input name="email" type="email" required></label>
    <label>Пароль<input name="password" type="password" required></label>
    <div class="err" id="lerr"></div>
    <button class="btn p" type="submit">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="logo">GoCase · Admin</div>
    <nav class="tabs">
      <button class="tab" data-t="models">Модели</button>
      <button class="tab" data-t="categories">Категории</button>
      <button class="tab" data-t="products">Товары</button>
      <button class="tab" data-t="texts">Тексты сайта</button>
    </nav>
    <button class="btn" id="logout">Выйти</button>
  </header>
  <main>
    <div class="bar"><h1 id="title"></h1><button class="btn p" id="add">+ Добавить</button></div>
    <div class="grid" id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <div class="dh"><h2 id="dt"></h2><button class="btn sm" id="dx" type="button">✕</button></div>
  <form class="f" id="ff"></form>
  <div class="dfoot"><button class="btn" type="button" id="dc">Отмена</button><button class="btn p" form="ff" type="submit">Сохранить</button></div>
</dialog>
<div id="toast"></div>

<script>
const E = {
  models: { title: 'Модели', one: 'модель', f: [
    { k: 'name', l: 'Название (например, Cobalt)', t: 'text', req: 1 },
    { k: 'slug', l: 'Slug (необязательно, сгенерируется)', t: 'text' },
    { k: 'sort', l: 'Порядок', t: 'num' },
    { k: 'image_id', l: 'Фото модели (покажется на карточках товаров)', t: 'img' },
    { k: 'active', l: 'Показывать на сайте', t: 'bool' }]},
  categories: { title: 'Категории', one: 'категорию', f: [
    { k: 'name_ru', l: 'Название (RU)', t: 'text', req: 1 },
    { k: 'name_uz', l: 'Nomi (UZ)', t: 'text' },
    { k: 'slug', l: 'Slug (необязательно)', t: 'text' },
    { k: 'sort', l: 'Порядок', t: 'num' },
    { k: 'image_id', l: 'Обложка категории', t: 'img' },
    { k: 'active', l: 'Показывать на сайте', t: 'bool' }]},
  products: { title: 'Товары', one: 'товар', f: [
    { k: 'code', l: 'Метка на карточке (например, EVA)', t: 'text' },
    { k: 'category_id', l: 'Категория', t: 'cat' },
    { k: 'name_ru', l: 'Название (RU)', t: 'text', req: 1 },
    { k: 'name_uz', l: 'Nomi (UZ)', t: 'text' },
    { k: 'desc_ru', l: 'Описание (RU)', t: 'area' },
    { k: 'desc_uz', l: 'Tavsif (UZ)', t: 'area' },
    { k: 'price', l: 'Цена, сум', t: 'num', req: 1 },
    { k: 'images', l: 'Фото товара (первое — на карточке)', t: 'imgs' },
    { k: 'fits', l: 'Подходит к моделям', t: 'fits' },
    { k: 'active', l: 'В продаже', t: 'bool' }]},
  texts: { title: 'Тексты сайта', one: '' }
};
let tab = 'models', D = { models: [], categories: [], products: [] }, editing = null, curImg = null, curImgs = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => Number(n).toLocaleString('ru-RU') + ' сум';
const img = id => id ? `/api/img/${id}` : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

async function api(p, o = {}) {
  const r = await fetch('/api/' + p, { credentials: 'same-origin', method: o.m || 'GET',
    headers: { 'Content-Type': 'application/json' }, body: o.b ? JSON.stringify(o.b) : undefined });
  if (r.status === 401) { showLogin(); throw new Error('Нужен вход'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка');
  return j;
}
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }
async function loadAll() {
  const [m, c, p] = await Promise.all(['models', 'categories', 'products'].map(x => api('admin/' + x)));
  D = { models: m, categories: c, products: p };
}

// картинки: ужимаем в браузере до 1400px и грузим в базу
async function compress(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.86);
}
async function upload(file) {
  const r = await api('uploads', { m: 'POST', b: { data: await compress(file) } });
  return r.id;
}

function card(r) {
  let body = '';
  if (tab === 'models') body = `${r.image_id ? `<img class="thumb" src="${img(r.image_id)}" alt="">` : ''}<h3>${esc(r.name)}</h3><div class="muted">slug: ${esc(r.slug)} · порядок ${r.sort}</div>
    <span class="pill ${r.active ? '' : 'off'}">${r.active ? 'на сайте' : 'скрыта'}</span>`;
  if (tab === 'categories') body = `${r.image_id ? `<img class="thumb" src="${img(r.image_id)}" alt="">` : ''}
    <h3>${esc(r.name_ru)}</h3><div class="muted">${esc(r.name_uz)} · ${esc(r.slug)}</div>
    <span class="pill ${r.active ? '' : 'off'}">${r.active ? 'на сайте' : 'скрыта'}</span>`;
  if (tab === 'products') {
    const cat = D.categories.find(c => c.id === r.category_id);
    const fits = (r.fits || []).map(id => D.models.find(m => m.id === id)).filter(Boolean);
    body = `${r.images?.[0] ? `<img class="thumb" src="${img(r.images[0])}" alt="">` : ''}
      <div class="muted">${esc(r.code)} · ${esc(cat?.name_ru || 'без категории')}</div>
      <h3>${esc(r.name_ru)}</h3><div class="price">${money(r.price)}</div>
      <div class="chips">${fits.map(m => `<span class="chip">${esc(m.name)}</span>`).join('') || '<span class="muted">ни к одной модели</span>'}</div>
      <span class="pill ${r.active ? '' : 'off'}">${r.active ? 'в продаже' : 'скрыт'}</span>`;
  }
  return `<div class="item">${body}<div class="actions">
    <button class="btn sm s" onclick="openForm(${r.id})">Изменить</button>
    <button class="btn sm d" onclick="del(${r.id})">Удалить</button></div></div>`;
}
async function renderTexts() {
  const d = await api('texts');
  $('#list').innerHTML = Object.entries(d).map(([k, v]) => `<div class="item">
    <div class="muted">${esc(k)}</div>
    <label>RU<textarea id="ru_${k}">${esc(v.ru)}</textarea></label>
    <label>UZ<textarea id="uz_${k}">${esc(v.uz)}</textarea></label>
    <div class="actions"><button class="btn sm p" onclick="saveText('${k}')">Сохранить</button></div></div>`).join('');
}
async function saveText(k) {
  try { await api('texts/' + k, { m: 'PUT', b: { ru: $('#ru_' + k).value, uz: $('#uz_' + k).value } }); toast('Сохранено · обнови сайт'); }
  catch (e) { toast(e.message); }
}
function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#title').textContent = E[tab].title;
  $('#add').hidden = tab === 'texts';
  if (tab === 'texts') return renderTexts();
  $('#list').classList.remove('stack');
  const list = D[tab];
  $('#list').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Пока пусто — нажми «+ Добавить»</div>';
}

function input(f, v) {
  if (f.t === 'bool') return `<label class="inline"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${f.l}</label>`;
  if (f.t === 'area') return `<label>${f.l}<textarea name="${f.k}">${esc(v)}</textarea></label>`;
  if (f.t === 'cat') return `<label>${f.l}<select name="${f.k}"><option value="">— без категории —</option>
    ${D.categories.map(c => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c.name_ru)}</option>`).join('')}</select></label>`;
  if (f.t === 'fits') return `<div class="muted" style="font-weight:700">${f.l}</div><div class="fits">
    ${D.models.map(m => `<label><input type="checkbox" name="fits" value="${m.id}" ${(v || []).includes(m.id) ? 'checked' : ''}>${esc(m.name)}</label>`).join('') || '<span class="muted">сначала добавь модели</span>'}</div>`;
  if (f.t === 'img' || f.t === 'imgs') return `<div class="muted" style="font-weight:700">${f.l}</div><div class="gal" id="gal"></div>`;
  return `<label>${f.l}<input name="${f.k}" type="${f.t === 'num' ? 'number' : 'text'}" value="${esc(v ?? '')}" ${f.req ? 'required' : ''}></label>`;
}
function drawGallery() {
  const box = $('#gal'); if (!box) return;
  const ids = tab === 'products' ? curImgs : (curImg ? [curImg] : []);
  box.innerHTML = ids.map((id, i) => `<div class="g"><img src="${img(id)}" alt=""><button type="button" class="x" data-rm="${i}">✕</button></div>`).join('')
    + `<label class="up">+ Фото<input type="file" accept="image/*" ${tab === 'products' ? 'multiple' : ''} id="imgIn"></label>`;
}
function openForm(id) {
  editing = id;
  const r = id ? D[tab].find(x => x.id === id) : { active: true, sort: 0, price: 0 };
  curImg = r.image_id ?? null;
  curImgs = [...(r.images || [])];
  $('#dt').textContent = (id ? 'Изменить ' : 'Новый ') + E[tab].one;
  $('#ff').innerHTML = E[tab].f.map(f => input(f, f.k === 'fits' ? (r.fits || []) : r[f.k])).join('');
  drawGallery();
  $('#dlg').showModal();
}
$('#ff').addEventListener('change', async e => {
  if (e.target.id !== 'imgIn') return;
  const files = [...e.target.files];
  for (const f of files) {
    try {
      const id = await upload(f);
      if (tab === 'products') curImgs.push(id); else curImg = id;
    } catch (err) { toast(err.message); }
  }
  drawGallery();
});
$('#ff').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  if (tab === 'products') curImgs.splice(+b.dataset.rm, 1); else curImg = null;
  drawGallery();
});
async function del(id) {
  if (!confirm('Удалить запись?')) return;
  try { await api(`admin/${tab}/${id}`, { m: 'DELETE' }); await loadAll(); render(); toast('Удалено'); }
  catch (e) { toast(e.message); }
}

$('#ff').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target), b = {};
  for (const f of E[tab].f) {
    if (f.t === 'bool') b[f.k] = fd.get(f.k) === 'on';
    else if (f.t === 'fits') b.fits = fd.getAll('fits').map(Number);
    else if (f.t === 'imgs') b.images = curImgs;
    else if (f.t === 'img') b[f.k] = curImg;
    else if (f.t === 'num') b[f.k] = fd.get(f.k) === '' ? 0 : Number(fd.get(f.k));
    else if (f.t === 'cat') b[f.k] = fd.get(f.k) ? Number(fd.get(f.k)) : null;
    else b[f.k] = (fd.get(f.k) || '').trim();
  }
  try {
    if (editing) await api(`admin/${tab}/${editing}`, { m: 'PUT', b });
    else await api(`admin/${tab}`, { m: 'POST', b });
    $('#dlg').close(); await loadAll(); render(); toast('Сохранено');
  } catch (err) { toast(err.message); }
};
$('#dc').onclick = $('#dx').onclick = () => $('#dlg').close();
$('#add').onclick = () => openForm(null);
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
$('#logout').onclick = async () => { await api('logout', { m: 'POST' }).catch(() => {}); showLogin(); };

$('#lf').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('#lerr').textContent = j.error || 'Ошибка входа'; return; }
  start();
};
async function start() {
  try { await api('me'); } catch { return showLogin(); }
  $('#login').hidden = true; $('#app').hidden = false;
  await loadAll(); render();
}
start();
</script>
</body>
</html>
